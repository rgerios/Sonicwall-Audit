server {
  listen 80;
  server_name _;

  client_max_body_size 60m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;

  root /usr/share/nginx/html;
  index index.html;

  # Vite hashed static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Autenticação única compartilhada
  location /api/auth/ {
    proxy_pass http://backend-sonicwall:3000/api/auth/;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /api/health {
    proxy_pass http://backend-sonicwall:3000/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }

  # Ambiente SonicWall (container backend-sonicwall)
  location /api/sonicwall/ {
    proxy_pass http://backend-sonicwall:3000/api/sonicwall/;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Ambiente FortiGate (container backend-fortigate)
  location /api/fortigate/ {
    proxy_pass http://backend-fortigate:3001/api/fortigate/;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
