# O painel é servido SOMENTE em HTTPS (porta 443 do container). Não existe porta HTTP publicada.

# --- Verificação de saúde do Docker -----------------------------------------------------------------
# Escuta apenas no loopback DENTRO do container (127.0.0.1): não é alcançável de fora nem por outros
# containers, e não é publicada no compose. Existe só para o HEALTHCHECK não depender do certificado.
server {
  listen 127.0.0.1:80;
  server_name localhost;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}

# --- HTTPS (porta 443 do container) -----------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # Quem fala HTTP puro na porta HTTPS recebe um redirecionamento em vez do erro 400 do nginx
  # DNS interno do Docker: o nginx reresolve os backends a cada 10s. Sem isso ele guarda o IP do
  # momento da subida e dá 502 quando um backend é recriado (ex.: docker compose up -d --build backend-sonicwall).
  resolver 127.0.0.11 valid=10s ipv6=off;

  error_page 497 =301 https://$http_host$request_uri;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 60m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;

  root /usr/share/nginx/html;
  index index.html;

  # CA pública para importar no navegador (confira a impressão digital mostrada pelo deploy.sh)
  location = /fwaudit-ca.crt {
    alias /etc/nginx/certs/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="fwaudit-ca.crt"' always;
    add_header Cache-Control "no-store" always;
  }

  # Vite hashed static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Autenticação única compartilhada
  location /api/auth/ {
    set $sw_upstream backend-sonicwall:3000;
    proxy_pass http://$sw_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /api/health {
    set $sw_upstream backend-sonicwall:3000;
    proxy_pass http://$sw_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }

  # Ambiente SonicWall (container backend-sonicwall)
  location /api/sonicwall/ {
    set $sw_upstream backend-sonicwall:3000;
    proxy_pass http://$sw_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Ambiente FortiGate (container backend-fortigate)
  location /api/fortigate/ {
    set $fg_upstream backend-fortigate:3001;
    proxy_pass http://$fg_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
